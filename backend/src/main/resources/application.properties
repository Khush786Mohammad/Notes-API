spring.application.name=notes-api
server.port = 8080
server.servlet.context-path = /notes-api/v1

spring.datasource.name=datasource
spring.datasource.url=jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/notesDB?sslMode=VERIFY_IDENTITY
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#logging.level.org.springframework.security = TRACE

spring.jpa.hibernate.ddl-auto= validate
spring.jpa.show-sql = true

spring.security.jwt.secretkey = ${JWT_SECRET}
spring.security.jwt.expiration_time = 3600000

